name: Periodic Strava Sync

on:
  # Scheduled execution moved to the Railway worker (worker/scheduler.py).
  workflow_dispatch:
    inputs:
      rider_id:
        description: 'Optional rider ID to force backfill (leave empty for auto)'
        required: false
        type: string

jobs:
  sync-strava:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Sync and Backfill Strava Activities
        run: |
          echo "Starting Strava sync..."

          # Build request body (include rider_id if provided)
          BODY="{}"
          if [ -n "${{ github.event.inputs.rider_id }}" ]; then
            BODY='{"rider_id": ${{ github.event.inputs.rider_id }}}'
            echo "Forcing backfill for rider_id=${{ github.event.inputs.rider_id }}"
          fi

          # Loop: each call does Phase 1 (recent sync) + Phase 2 (one backfill round)
          # Keep calling until rate-limited or all riders fully backfilled
          ROUND=0
          MAX_ROUNDS=20

          while [ $ROUND -lt $MAX_ROUNDS ]; do
            ROUND=$((ROUND + 1))
            echo ""
            echo "=== Round $ROUND ==="

            response=$(curl -X POST https://team-asha-randonneuring.vercel.app/api/cron/sync-strava \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              -w "\n%{http_code}" \
              --max-time 60 \
              -s)

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            echo "HTTP Status: $http_code"
            echo "Response: $body"

            if ! [[ "$http_code" =~ ^2 ]]; then
              echo "Sync failed with status $http_code — stopping"
              break
            fi

            # Check if backfill hit rate limit or error
            backfill_error=$(echo "$body" | jq -r '.backfill.error // empty' 2>/dev/null)
            if [ -n "$backfill_error" ]; then
              echo "Backfill error: $backfill_error — stopping"
              break
            fi

            # Check if all riders fully backfilled
            backfill_status=$(echo "$body" | jq -r '.backfill.status // empty' 2>/dev/null)
            if [ "$backfill_status" = "All riders fully backfilled" ]; then
              echo "All riders fully backfilled — done!"
              break
            fi

            # Brief pause between rounds
            sleep 2
          done

          echo ""
          echo "Completed $ROUND round(s)"

      - name: Report Failure
        if: failure()
        run: |
          echo "::error::Strava sync failed - check the logs above for details"
          echo "Possible causes:"
          echo "- CRON_SECRET not set or incorrect"
          echo "- Vercel deployment issue"
          echo "- Strava API rate limit exceeded"
          echo "- Database connection error"
