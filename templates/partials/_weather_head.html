<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<style>
.weather-container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
.input-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 24px;
}
.input-card h2 { margin: 0 0 16px; font-size: 1.25rem; color: var(--text); }
.form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.form-group { display: flex; flex-direction: column; gap: 4px; }
.form-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-light); }
.form-group input {
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    background: var(--bg);
    color: var(--text);
}
.form-group input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
.btn-fetch {
    padding: 10px 24px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
}
.btn-fetch:hover { background: var(--primary-dark); }
.btn-fetch:disabled { background: #94a3b8; cursor: not-allowed; }

.loading { text-align: center; padding: 40px; display: none; }
.loading .spinner {
    width: 36px; height: 36px;

    border-top-color: var(--primary);
    border-radius: 50%;

    margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-alert {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    display: none;
}

/* Summary bar */
.summary-bar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 16px;
    display: none;
}
.summary-bar h3 { margin: 0 0 8px; font-size: 1.1rem; }
.summary-chips { display: flex; gap: 12px; flex-wrap: wrap; }

.share-btn {

.share-feedback.success { color: #166534; }
.share-feedback.error { color: #991b1b; }
.chip {

    font-weight: 600;
    background: #f1f5f9;
    color: var(--text);
}
.chip.headwind { background: #fef2f2; color: #991b1b; }
.chip.tailwind { background: #f0fdf4; color: #166534; }
.chip.crosswind { background: #fffbeb; color: #92400e; }

    margin-bottom: 24px;
    display: none;

.wind-arrow-inline {

.badge-tailwind { background: #dcfce7; color: #166534; }

.map-section {

    padding: 14px 20px;
    font-size: 1rem;
    border-bottom: 1px solid var(--border);

.map-section { display: flex; flex-direction: column; }

    top: 10px;
    left: 10px;

    font-size: 0.72rem;
}
.map-style-btn {
    padding: 6px 10px;
    border: none;
    background: white;
    color: #475569;

.map-style-btn:hover { background: #f1f5f9; }

.charts-section { margin-bottom: 24px; }
.charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

    .charts-grid { grid-template-columns: 1fr; }

.chart-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
}

    margin: 0 0 8px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text);
}
.chart-card canvas { max-height: 220px; }

/* Legend */
.map-legend {
    display: flex;
    gap: 16px;
    padding: 10px 20px;
    background: #f8fafc;

    font-size: 0.8rem;
    flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot {

    height: 12px;
    border-radius: 50%;

.attribution {
    text-align: center;
    font-size: 0.75rem;
    color: var(--text-light);
    padding: 8px;
    display: none;
}

    .form-group input { width: 100%; }
    .weather-table { font-size: 0.75rem; }
    .weather-table th, .weather-table td { padding: 8px 10px; }
