{% extends "base.html" %}
{% block title %}Edit Plan Info - {{ plan.name }}{% endblock %}

{% block content %}
<div class="hero" style="padding:30px 20px;">
    <h1>Edit Plan Info</h1>
    <p style="opacity:0.85;">{{ plan.name }}</p>
</div>

<div class="container section" style="max-width:600px;">
    <div style="margin-bottom:20px;">
        <a href="{{ url_for('riders.ride_plan_detail', slug=plan.slug) }}" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">&larr; Back to Plan</a>
        &nbsp;&bull;&nbsp;
        <a href="{{ url_for('riders.base_plan_editor', slug=plan.slug) }}" style="color:var(--primary);text-decoration:none;font-size:0.9rem;">Edit Stops</a>
    </div>

    <form method="POST">
        <div style="background:white;border-radius:12px;border:1px solid #e2e8f0;padding:24px;display:flex;flex-direction:column;gap:18px;">

            <div>
                <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text);margin-bottom:4px;">Plan Name</label>
                <input type="text" name="name" value="{{ plan.name or '' }}" required
                    style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.9rem;">
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div>
                    <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text);margin-bottom:4px;">Distance (km)</label>
                    <input type="number" name="distance_km" value="{{ plan.distance_km or '' }}"
                        style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.9rem;">
                </div>
                <div>
                    <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text);margin-bottom:4px;">Cutoff Hours</label>
                    <input type="number" step="0.5" name="cutoff_hours" value="{{ plan.cutoff_hours or '' }}"
                        style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.9rem;">
                </div>
            </div>

            <div>
                <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text);margin-bottom:4px;">Start Time (HH:MM)</label>
                <input type="time" name="start_time" value="{{ plan.start_time or '06:00' }}"
                    style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.9rem;">
            </div>

            <div>
                <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text);margin-bottom:4px;">Official RWGPS URL</label>
                <input type="url" name="rwgps_url" value="{{ plan.rwgps_url or '' }}" placeholder="https://ridewithgps.com/routes/..."
                    style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.9rem;">
            </div>

            <div>
                <label style="display:block;font-size:0.85rem;font-weight:600;color:var(--text);margin-bottom:4px;">Team Asha RWGPS URL <span style="font-weight:400;color:var(--text-light);">(preferred)</span></label>
                <input type="url" name="rwgps_url_team" value="{{ plan.rwgps_url_team or '' }}" placeholder="https://ridewithgps.com/routes/..."
                    style="width:100%;padding:8px 12px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.9rem;">
            </div>

            <div style="display:flex;gap:12px;justify-content:flex-end;padding-top:8px;border-top:1px solid #e2e8f0;">
                <a href="{{ url_for('riders.ride_plan_detail', slug=plan.slug) }}"
                    style="padding:10px 20px;border:1px solid #cbd5e1;border-radius:8px;font-size:0.9rem;text-decoration:none;color:var(--text);font-weight:600;">Cancel</a>
                <button type="submit"
                    style="padding:10px 24px;background:var(--primary);color:white;border:none;border-radius:8px;font-size:0.9rem;font-weight:600;cursor:pointer;">
                    Save Changes
                </button>
            </div>
        </div>
    </form>
</div>
{% endblock %}
